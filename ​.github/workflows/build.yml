name: Build DiveGram

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36, NDK 27 and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build DiveGram APK
        env:
          TELEGRAM_APP_ID: "38561070"
          TELEGRAM_APP_HASH: "3b9eb5a47582ea2cd2c4e15588ab41e3"
        run: ./gradlew :TMessagesProj:assembleAfatDebug

      - name: Upload DiveGram APK
        uses: actions/upload-artifact@v4
        with:
          name: DiveGram-org.divegram.gvs
          path: |
            TMessagesProj/build/outputs/apk/afat/debug/*.apk
            TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
